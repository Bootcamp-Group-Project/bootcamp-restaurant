services:
  restaurant-app:
    image: ${APP_IMAGE:-canteen-app}
    env_file: .env
    environment:
      IMAGE_UPLOAD_DIR: /app/uploads/menu
      JAVA_TOOL_OPTIONS: -Xmx480m -Xms128m -XX:+UseContainerSupport
    volumes:
      - uploads_data:/app/uploads/menu
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 700m

  nginx:
    image: nginx:1.29
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - restaurant-app
    restart: unless-stopped

volumes:
  uploads_data:
